<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - MiniShop</title>
</head>

<body>
    <!-- Buổi 01 - Bài tập về nhà: Đăng nhập -->

    <header class="site-header">
        <h1>MiniShop</h1>
        <nav class="main-nav">
            <a href="index.html">Trang chủ</a> |
            <a href="about.html">Giới thiệu</a> |
            <a href="register.html">Đăng ký</a> |
            <a href="login.html">Đăng nhập</a> |
            <a href="cart.html">Giỏ hàng</a> |
            <a href="contact.html">Liên hệ</a>
        </nav>
    </header>

    <main>
        <h2>Đăng nhập</h2>

        <form action="login.html" method="get" class="form">
            <p>
                <label for="email">Email</label><br>
                <input type="email" id="email" name="email"
                    required placeholder="ten@example.com">
            </p>
            <p>
                <label for="password">Mật khẩu</label><br>
                <input type="password" id="password" name="password"
                    required minlength="6">
            </p>
            <p>
                <input type="checkbox" id="remember" name="remember" value="yes">
                <label for="remember">Ghi nhớ đăng nhập</label>
            </p>
            <p>
                <button type="submit">Đăng nhập</button>
            </p>
        </form>

        <p>Chưa có tài khoản? <a href="register.html">Đăng ký</a></p>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 MiniShop. Dự án thực hành lập trình web.</p>
    </footer>
</body>

</html>
