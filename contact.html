<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ - MiniShop</title>
</head>

<body>
    <!-- Buổi 01 - Bài tập về nhà: Liên hệ -->

    <header class="site-header">
        <h1>MiniShop</h1>
        <nav class="main-nav">
            <a href="index.html">Trang chủ</a> |
            <a href="about.html">Giới thiệu</a> |
            <a href="register.html">Đăng ký</a> |
            <a href="login.html">Đăng nhập</a> |
            <a href="cart.html">Giỏ hàng</a> |
            <a href="contact.html">Liên hệ</a>
        </nav>
    </header>

    <main>
        <h2>Liên hệ với chúng tôi</h2>

        <form action="contact.html" method="get" class="form">
            <p>
                <label for="fullname">Họ và tên</label><br>
                <input type="text" id="fullname" name="fullname"
                    required minlength="2" maxlength="100" placeholder="Nguyễn Văn An">
            </p>
            <p>
                <label for="email">Email</label><br>
                <input type="email" id="email" name="email"
                    required placeholder="ten@example.com">
            </p>
            <p>
                <label for="subject">Tiêu đề</label><br>
                <input type="text" id="subject" name="subject"
                    required maxlength="150">
            </p>
            <p>
                <label for="message">Nội dung</label><br>
                <textarea id="message" name="message" rows="6" cols="50" required></textarea>
            </p>
            <p>
                <button type="submit">Gửi</button>
            </p>
        </form>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 MiniShop. Dự án thực hành lập trình web.</p>
    </footer>
</body>

</html>
